<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./style/login.css">
</head>

<body>
    <div class="container no-select">
        <div class="content-form fade-slide">
            <div class="logo">
                <img src="../public/logo.png" alt="logo batik">
            </div>
            <div class="head">
                <h1 class="title">Selamat Datang di <span class="clr-secan">Batik Blitar</span></h1>
                <p class="subtitle">Masuk ke akun Anda dan mulai jelajahi koleksi batik terbaik kami.</p>
            </div>

            <form action="">
                <div class="input-grub">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username">
                </div>
                <div class="input-grub">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password">
                    <button type="button" class="toggle-password">Show</button>
                </div>
                <button>Sign In</button>
            </form>
            <p class="sign">Don't have an account?<a href="#" class="clr-secan">Register Now.</a></p>
        </div>
    </div>

    <script>
        document.querySelectorAll('.input-grub').forEach(group => {
            const input = group.querySelector('input');

            const updateState = () => {
                if (
                    document.activeElement === input ||
                    group.matches(':hover') ||
                    input.value.trim() !== ''
                ) {
                    group.classList.add('active');
                } else {
                    group.classList.remove('active');
                }
            };

            input.addEventListener('focus', updateState);
            input.addEventListener('blur', updateState);
            input.addEventListener('input', updateState);
            group.addEventListener('mouseenter', updateState);
            group.addEventListener('mouseleave', updateState);

            updateState();
        });

        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = btn.previousElementSibling;

                if (input.type === 'password') {
                    input.type = 'text';
                    btn.textContent = 'Hide';
                } else {
                    input.type = 'password';
                    btn.textContent = 'Show';
                }

                input.focus();
            });
        });
    </script>

</body>

</html>
